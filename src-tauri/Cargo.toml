[package]
name = "floatick"
version = "0.5.1"
description = "A focused, local-first floating todo and note app for macOS"
authors = ["Lucas"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "floatick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSKeyValueCoding", "NSValue"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["objc2-app-kit", "WKWebView"] }
